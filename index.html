<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Disvical — Snipe Services</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
    --pink:#ff4fa3;
    --pink-light:#ff8ac4;
    --pink-dark:#c7347c;
    --black:#050505;
    --black-2:#0d0d0d;
    --gray:#1a1a1a;
    --gray-2:#262626;
    --white:#ffffff;
    --white-soft:#e8e8e8;
}

html,body{height:100%;}

body{
    font-family:"Inter",sans-serif;
    background:var(--black);
    color:var(--white);
    overflow-x:hidden;
    cursor:none;
    min-height:100vh;
    position:relative;
}

/* ============ BACKGROUND GRID ============ */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(rgba(255,79,163,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,79,163,.05) 1px, transparent 1px);
    background-size:60px 60px;
    z-index:0;
    pointer-events:none;
    animation:gridMove 3s linear infinite;
    mask-image:radial-gradient(ellipse at center, black 30%, transparent 85%);
}

@keyframes gridMove{
    from{background-position:0 0;}
    to{background-position:0 60px;}
}

/* ============ GRADIENT GLOW ============ */
body::after{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 30%, rgba(255,79,163,.15), transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(199,52,124,.12), transparent 45%);
    z-index:0;
    pointer-events:none;
    animation:glowPulse 8s ease-in-out infinite;
}

@keyframes glowPulse{
    0%,100%{opacity:.7;}
    50%{opacity:1;}
}

/* ============ CANVASES ============ */
#particles,#cursorTrail{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
}

#cursorTrail{z-index:9999;}

/* ============ HERO ============ */
.hero{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:60px 40px;
    gap:50px;
}

/* ============ TITLE ============ */
.hero-title{
    text-align:center;
    animation:fadeInDown 1s ease both;
}

.hero-title h1{
    font-family:"Orbitron",sans-serif;
    font-size:clamp(32px,5vw,58px);
    font-weight:900;
    letter-spacing:4px;
    background:linear-gradient(135deg,#ffffff 0%,#ff8ac4 50%,#ff4fa3 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 25px rgba(255,79,163,.6));
    margin-bottom:14px;
    text-transform:uppercase;
}

.hero-title p{
    font-size:13px;
    letter-spacing:8px;
    color:var(--white-soft);
    text-transform:uppercase;
    font-weight:300;
    opacity:.75;
    animation:letterSpacing 3s ease-in-out infinite;
}

@keyframes letterSpacing{
    0%,100%{letter-spacing:8px;opacity:.75;}
    50%{letter-spacing:12px;opacity:1;}
}

@keyframes fadeInDown{
    from{opacity:0;transform:translateY(-30px);}
    to{opacity:1;transform:translateY(0);}
}

/* ============ HERO CONTENT ============ */
.hero-content{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:60px;
    flex-wrap:wrap;
    animation:fadeInUp 1s ease .3s both;
}

@keyframes fadeInUp{
    from{opacity:0;transform:translateY(40px);}
    to{opacity:1;transform:translateY(0);}
}

/* ============ SCREEN (UI) ============ */
.screen{
    width:620px;
    max-width:100%;
    background:linear-gradient(145deg, rgba(20,20,20,.95), rgba(10,10,10,.85));
    border:1px solid rgba(255,79,163,.35);
    border-radius:22px;
    box-shadow:
        0 0 50px rgba(255,79,163,.25),
        inset 0 0 30px rgba(255,79,163,.05);
    padding:26px;
    backdrop-filter:blur(14px);
    position:relative;
    overflow:hidden;
    transition:all .4s cubic-bezier(.4,0,.2,1);
}

.screen::before{
    content:"";
    position:absolute;
    top:-50%;
    left:-50%;
    width:200%;
    height:200%;
    background:conic-gradient(from 0deg, transparent, rgba(255,79,163,.15), transparent 30%);
    animation:rotate 6s linear infinite;
    z-index:0;
}

.screen > *{position:relative;z-index:1;}

@keyframes rotate{
    to{transform:rotate(360deg);}
}

.screen:hover{
    border-color:var(--pink);
    box-shadow:
        0 0 70px rgba(255,79,163,.4),
        inset 0 0 40px rgba(255,79,163,.1);
    transform:translateY(-4px);
}

/* ============ FAKE UI ============ */
.fake-ui{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.panel{
    height:150px;
    background:linear-gradient(145deg, rgba(30,30,30,.9), rgba(18,18,18,.7));
    border-radius:16px;
    border:1px solid rgba(255,79,163,.2);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    font-family:"Orbitron",sans-serif;
    font-size:14px;
    font-weight:600;
    letter-spacing:2px;
    color:var(--white);
    text-shadow:0 0 12px rgba(255,79,163,.6);
    transition:all .35s cubic-bezier(.4,0,.2,1);
    cursor:pointer;
    position:relative;
    overflow:hidden;
}

.panel::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,79,163,.35), transparent 60%);
    opacity:0;
    transition:opacity .3s ease;
    pointer-events:none;
}

.panel:hover::after{opacity:1;}

.panel svg{
    transition:transform .35s ease;
    filter:drop-shadow(0 0 6px rgba(255,79,163,.8));
}

.panel:hover{
    transform:translateY(-6px) scale(1.02);
    border-color:var(--pink);
    box-shadow:
        0 8px 30px rgba(255,79,163,.35),
        inset 0 0 20px rgba(255,79,163,.15);
    background:linear-gradient(145deg, rgba(255,79,163,.15), rgba(30,30,30,.9));
}

.panel:hover svg{
    transform:scale(1.15) rotate(-6deg);
}

.panel:active{
    transform:translateY(-2px) scale(.99);
}

.panel span{
    font-size:11px;
    letter-spacing:3px;
    opacity:.6;
    font-family:"Inter",sans-serif;
    font-weight:300;
}

/* ============ SIDE IMAGE ============ */
.side-image{
    width:400px;
    max-width:100%;
    aspect-ratio:1/1;
    border-radius:24px;
    overflow:hidden;
    position:relative;
    border:1px solid rgba(255,79,163,.3);
    box-shadow:
        0 0 60px rgba(255,79,163,.3),
        inset 0 0 40px rgba(255,79,163,.1);
    transition:all .4s ease;
}

.side-image::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(135deg, rgba(255,79,163,.25), transparent 50%, rgba(199,52,124,.25));
    z-index:2;
    pointer-events:none;
    mix-blend-mode:overlay;
    transition:opacity .4s ease;
}

.side-image:hover{
    transform:scale(1.03) rotate(-1deg);
    box-shadow:
        0 0 90px rgba(255,79,163,.5),
        inset 0 0 60px rgba(255,79,163,.2);
}

.side-image:hover::before{
    opacity:.5;
}

.side-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:transform .6s cubic-bezier(.4,0,.2,1);
}

.side-image:hover img{
    transform:scale(1.08);
}

/* ============ MODAL ============ */
#aboutModal{
    position:fixed;
    bottom:24px;
    right:24px;
    width:520px;
    max-width:calc(100vw - 48px);
    height:460px;
    background:linear-gradient(145deg, rgba(18,18,18,.97), rgba(10,10,10,.95));
    border:1px solid rgba(255,79,163,.45);
    border-radius:18px;
    padding:22px;
    z-index:999999;
    box-shadow:
        0 20px 60px rgba(0,0,0,.6),
        0 0 50px rgba(255,79,163,.3),
        inset 0 0 30px rgba(255,79,163,.05);
    transform:translateY(30px) scale(.95);
    opacity:0;
    pointer-events:none;
    transition:all .4s cubic-bezier(.4,0,.2,1);
    display:flex;
    flex-direction:column;
    backdrop-filter:blur(16px);
}

#aboutModal.active{
    transform:translateY(0) scale(1);
    opacity:1;
    pointer-events:auto;
}

#aboutModal::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--pink), transparent);
    animation:shimmer 3s linear infinite;
}

@keyframes shimmer{
    0%{background-position:-200% 0;}
    100%{background-position:200% 0;}
}

#modalTitle{
    font-family:"Orbitron",sans-serif;
    font-size:18px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    background:linear-gradient(135deg,#fff,#ff4fa3);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

#modalTitle::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, var(--pink), transparent);
    margin-left:14px;
}

#aboutText{
    flex:1;
    overflow-y:auto;
    font-size:14px;
    line-height:1.7;
    color:var(--white-soft);
    white-space:pre-line;
    padding-right:8px;
}

#aboutText::-webkit-scrollbar{
    width:5px;
}

#aboutText::-webkit-scrollbar-track{
    background:rgba(255,79,163,.05);
    border-radius:3px;
}

#aboutText::-webkit-scrollbar-thumb{
    background:var(--pink);
    border-radius:3px;
    box-shadow:0 0 10px var(--pink);
}

.modal-buttons{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid rgba(255,79,163,.15);
}

#langSelect{
    background:rgba(255,79,163,.1);
    border:1px solid rgba(255,79,163,.4);
    color:var(--white);
    font-size:12px;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
    outline:none;
    font-family:"Inter",sans-serif;
    transition:all .3s ease;
}

#langSelect:hover,#langSelect:focus{
    border-color:var(--pink);
    box-shadow:0 0 20px rgba(255,79,163,.3);
}

#langSelect option{
    background:var(--black-2);
    color:var(--white);
}

button{
    background:linear-gradient(135deg, rgba(255,79,163,.15), rgba(255,79,163,.05));
    border:1px solid rgba(255,79,163,.45);
    color:var(--white);
    padding:8px 18px;
    font-size:12px;
    font-weight:600;
    letter-spacing:2px;
    text-transform:uppercase;
    border-radius:10px;
    cursor:pointer;
    font-family:"Inter",sans-serif;
    transition:all .3s cubic-bezier(.4,0,.2,1);
    position:relative;
    overflow:hidden;
}

button::before{
    content:"";
    position:absolute;
    top:50%;
    left:50%;
    width:0;
    height:0;
    background:radial-gradient(circle, rgba(255,79,163,.5), transparent);
    transform:translate(-50%,-50%);
    transition:all .5s ease;
    border-radius:50%;
}

button:hover::before{
    width:200px;
    height:200px;
}

button:hover{
    border-color:var(--pink);
    box-shadow:0 0 25px rgba(255,79,163,.4);
    transform:translateY(-2px);
}

button:active{
    transform:translateY(0) scale(.97);
}

/* ============ PRICE BUTTON ============ */
.price-btn{
    display:inline-block;
    margin-top:12px;
    padding:8px 16px;
    background:linear-gradient(135deg, rgba(255,79,163,.2), rgba(199,52,124,.1));
    border:1px solid var(--pink);
    border-radius:10px;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--white);
    text-shadow:0 0 10px var(--pink);
    transition:all .3s ease;
    font-family:"Inter",sans-serif;
}

.price-btn:hover{
    background:linear-gradient(135deg, rgba(255,79,163,.35), rgba(199,52,124,.2));
    box-shadow:0 0 30px rgba(255,79,163,.6);
    transform:translateY(-2px);
}

/* ============ RESPONSIVE ============ */
@media (max-width:980px){
    .hero-content{flex-direction:column;gap:40px;}
    .side-image{width:300px;}
    .screen{width:100%;}
    .panel{height:120px;font-size:12px;}
    #aboutModal{width:calc(100vw - 32px);height:400px;bottom:16px;right:16px;left:16px;}
}

@media (max-width:520px){
    .fake-ui{grid-template-columns:1fr;}
    .hero-title h1{font-size:26px;letter-spacing:2px;}
    .hero-title p{font-size:10px;letter-spacing:5px;}
}
</style>
</head>

<body>

<canvas id="particles"></canvas>
<canvas id="cursorTrail"></canvas>

<section class="hero">

    <div class="hero-title">
        <h1>Disvical</h1>
        <p>Snipe Services</p>
    </div>

    <div class="hero-content">

        <div class="screen">
            <div class="fake-ui">

                <!-- YOUTUBE -->
                <div class="panel" data-link="https://www.youtube.com/@disvical">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ff4fa3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    YOUTUBE
                    <span>Subscribe</span>
                </div>

                <!-- ABOUT -->
                <div class="panel" data-action="about">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ff4fa3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="7" r="4"></circle>
                        <path d="M5.5 21a8.38 8.38 0 0 1 13 0"></path>
                    </svg>
                    ABOUT
                    <span>Who am I</span>
                </div>

                <!-- DISCORD -->
                <div class="panel" data-link="https://discord.gg/2ERVfhzzZr">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ff4fa3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    DISCORD
                    <span>Join Server</span>
                </div>

                <!-- ROBLOX -->
                <div class="panel" data-link="https://www.roblox.com/pt/users/4370995126">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ff4fa3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="14" rx="2"></rect>
                        <path d="M8 21l4-4 4 4"></path>
                    </svg>
                    ROBLOX
                    <span>Profile</span>
                </div>

            </div>
        </div>

        <div class="side-image">
            <img src="shidou.png" alt="Shidou">
        </div>

    </div>

</section>

<!-- MODAL -->
<div id="aboutModal">
    <div id="modalTitle">About me</div>
    <div id="aboutText"></div>

    <div class="modal-buttons">
        <select id="langSelect">
            <option value="en">English</option>
            <option value="pt">Português</option>
            <option value="kr">한국어</option>
        </select>
        <button onclick="closeAbout()">Close</button>
    </div>
</div>

<script>
/* ============ MODAL LOGIC ============ */
const modal = document.getElementById("aboutModal");
const text = document.getElementById("aboutText");
const select = document.getElementById("langSelect");
const title = document.getElementById("modalTitle");

const aboutData = {
    en:`Hi, I'm Disvical, nice to meet you!

I'm a high-level sniper and I finish my snipes in 2 days or less.

Discord @disvical`,
    pt:`Olá, eu sou o Disvical, prazer em te conhecer!

Sou um sniper de alto nível e finalizo meus snipes em 2 dias ou menos.

Discord @disvical`,
    kr:`안녕하세요, 저는 Disvical입니다.

빠르게 작업합니다.

Discord @disvical`
};

const pricesText = `--- Robux Only ---

Free Category:
Glitch Snipe: 250+ HPs (500+ for priority)
~ 750 if less than 250 HPs

Dreamspace Snipe: 250+ HPs (500+ for priority)
~ 750 if less than 250 HPs

Singularity Snipe: 20+ HPs (100+ to post on yt)
~ all free! :)

Cyberspace Snipe:
Not available yet

Mari Snipe:
20 = Void Coin (After tax)
10 = Lucky Penny (After tax)

Priority Category:
1000 = Instant Snipe

Expect to have your snipe done in 1-2 days
I usually finish a singularity snipe in less than 1 hour
Singularity snipes will always have priority`;

function openAbout(){
    modal.classList.add("active");
    setLang(select.value);
}

function closeAbout(){
    modal.classList.remove("active");
}

function setLang(lang){
    text.innerHTML = aboutData[lang].replace(/\n/g,'<br>') +
        `<br><br><span class="price-btn" onclick="togglePrices()">View Prices</span>`;
    title.innerText = "About me";
}

function togglePrices(){
    text.innerHTML = pricesText.replace(/\n/g,'<br>') +
        `<br><br><span class="price-btn" onclick="setLang(select.value)">Back</span>`;
    title.innerText = "Prices";
}

select.addEventListener('change', () => setLang(select.value));

/* ============ PANELS ============ */
document.querySelectorAll('.panel').forEach(panel => {
    panel.addEventListener('click', () => {
        // Efeito de clique
        panel.style.transform = 'scale(.94)';
        setTimeout(() => panel.style.transform = '', 150);

        const action = panel.dataset.action;
        const link = panel.dataset.link;

        if (action === 'about') openAbout();
        else if (link) window.open(link, '_blank');
    });

    // Efeito radial do mouse
    panel.addEventListener('mousemove', (e) => {
        const r = panel.getBoundingClientRect();
        panel.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
        panel.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
    });
});

/* ============ PARTICLES ============ */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let particles = [];

for (let i = 0; i < 90; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2.5 + 0.5,
        dx: (Math.random() - 0.5) * 0.4,
        dy: (Math.random() - 0.5) * 0.4,
        hue: Math.random() > 0.5 ? '#ff4fa3' : '#ffffff',
        alpha: Math.random() * 0.5 + 0.2
    });
}

function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Linhas entre partículas próximas
    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 120) {
                ctx.strokeStyle = `rgba(255,79,163,${(1 - dist/120) * 0.15})`;
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.stroke();
            }
        }
    }

    // Partículas
    for (let p of particles) {
        p.x += p.dx;
        p.y += p.dy;

        if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;

        ctx.fillStyle = p.hue;
        ctx.globalAlpha = p.alpha;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.hue;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    requestAnimationFrame(animateParticles);
}
animateParticles();

/* ============ CURSOR TRAIL ============ */
const tcanvas = document.getElementById("cursorTrail");
const tctx = tcanvas.getContext("2d");

tcanvas.width = innerWidth;
tcanvas.height = innerHeight;

let points = [];
let mouse = { x: innerWidth / 2, y: innerHeight / 2 };

document.addEventListener("mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

document.addEventListener("mousedown", () => {
    // Explosão de pontos no clique
    for (let i = 0; i < 12; i++) {
        points.push({
            x: mouse.x,
            y: mouse.y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 1
        });
    }
});

function drawCursor() {
    tctx.clearRect(0, 0, tcanvas.width, tcanvas.height);

    // Rastro principal
    points.push({ x: mouse.x, y: mouse.y, vx: 0, vy: 0, life: 1 });
    if (points.length > 25) points.shift();

    for (let i = 0; i < points.length; i++) {
        let p = points[i];
        let a = i / points.length;

        // Movimento dos pontos de explosão
        if (p.vx !== undefined) {
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.94;
            p.vy *= 0.94;
            p.life -= 0.03;
        }

        tctx.beginPath();
        tctx.fillStyle = `rgba(255,79,163,${a * (p.life || 1)})`;
        tctx.shadowBlur = 22;
        tctx.shadowColor = "#ff4fa3";
        tctx.arc(p.x, p.y, 5 * a + 1, 0, Math.PI * 2);
        tctx.fill();
    }

    // Cursor central
    tctx.beginPath();
    tctx.fillStyle = "#ffffff";
    tctx.shadowBlur = 25;
    tctx.shadowColor = "#ff4fa3";
    tctx.arc(mouse.x, mouse.y, 4, 0, Math.PI * 2);
    tctx.fill();

    // Anel externo
    tctx.beginPath();
    tctx.strokeStyle = "rgba(255,79,163,.6)";
    tctx.lineWidth = 1.5;
    tctx.shadowBlur = 15;
    tctx.shadowColor = "#ff4fa3";
    tctx.arc(mouse.x, mouse.y, 12, 0, Math.PI * 2);
    tctx.stroke();

    requestAnimationFrame(drawCursor);
}
drawCursor();

/* ============ RESIZE ============ */
addEventListener('resize', () => {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    tcanvas.width = innerWidth;
    tcanvas.height = innerHeight;
});
</script>

</body>
</html>
