<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disvical — Snipe Services</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
    --pink:#ff4fa3;
    --pink-light:#ff8ac4;
    --pink-dark:#c7347c;
    --black:#000000;
    --gray:#141414;
    --white:#ffffff;
}

html,body{height:100%;}

body{
    font-family:"Inter",sans-serif;
    background:#000;
    color:#fff;
    overflow-x:hidden;
    cursor:none;
    min-height:100vh;
    position:relative;
}

.bg{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
}

.bg::before{
    content:"";
    position:absolute;
    inset:-50%;
    background:
        radial-gradient(circle at 30% 40%, rgba(255,79,163,.32), transparent 40%),
        radial-gradient(circle at 70% 60%, rgba(199,52,124,.32), transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.04), transparent 60%);
    animation:bgMove 15s ease-in-out infinite;
    filter:blur(60px);
}

@keyframes bgMove{
    0%,100%{transform:translate(0,0) scale(1);}
    33%{transform:translate(10%,-5%) scale(1.15);}
    66%{transform:translate(-8%,8%) scale(1.1);}
}

.bg::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(rgba(255,79,163,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,79,163,.06) 1px, transparent 1px);
    background-size:50px 50px;
    animation:gridMove 4s linear infinite;
    mask-image:radial-gradient(ellipse at center, black 20%, transparent 80%);
    -webkit-mask-image:radial-gradient(ellipse at center, black 20%, transparent 80%);
}

@keyframes gridMove{
    from{background-position:0 0;}
    to{background-position:50px 50px;}
}

#particles{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
}

#cursorTrail{
    position:fixed;
    inset:0;
    z-index:2147483647;
    pointer-events:none;
}

.hero{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:60px 30px;
    gap:60px;
}

.title{
    text-align:center;
    position:relative;
    animation:titleIn 1.2s cubic-bezier(.4,0,.2,1) both;
}

@keyframes titleIn{
    from{opacity:0;transform:translateY(-50px) scale(.9);}
    to{opacity:1;transform:translateY(0) scale(1);}
}

.title h1{
    font-family:"Orbitron",sans-serif;
    font-size:clamp(48px,10vw,140px);
    font-weight:900;
    letter-spacing:-2px;
    line-height:.9;
    background:linear-gradient(180deg,#fff 0%,#ff8ac4 40%,#ff4fa3 70%,#c7347c 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 32px rgba(255,79,163,.64)) drop-shadow(0 0 64px rgba(255,79,163,.4));
    text-transform:uppercase;
    animation:titleGlow 3s ease-in-out infinite;
}

@keyframes titleGlow{
    0%,100%{filter:drop-shadow(0 0 32px rgba(255,79,163,.64)) drop-shadow(0 0 64px rgba(255,79,163,.4));}
    50%{filter:drop-shadow(0 0 48px rgba(255,79,163,.8)) drop-shadow(0 0 96px rgba(255,79,163,.56));}
}

.title .sub{
    font-size:14px;
    letter-spacing:20px;
    color:#ff8ac4;
    text-transform:uppercase;
    font-weight:300;
    margin-top:20px;
    padding-left:20px;
    animation:subPulse 2s ease-in-out infinite;
}

@keyframes subPulse{
    0%,100%{opacity:.6;letter-spacing:20px;}
    50%{opacity:1;letter-spacing:28px;}
}

.title::before,
.title::after{
    content:"";
    position:absolute;
    top:50%;
    width:80px;
    height:1px;
    background:linear-gradient(90deg,transparent,#ff4fa3);
}
.title::before{left:-100px;}
.title::after{right:-100px;background:linear-gradient(90deg,#ff4fa3,transparent);}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:24px;
    max-width:1200px;
    width:100%;
    animation:cardsIn 1s ease .4s both;
}

@keyframes cardsIn{
    from{opacity:0;transform:translateY(40px);}
    to{opacity:1;transform:translateY(0);}
}

.card{
    position:relative;
    aspect-ratio:1/1.15;
    border-radius:24px;
    background:linear-gradient(145deg, rgba(30,30,30,.7), rgba(10,10,10,.9));
    border:1px solid rgba(255,79,163,.2);
    overflow:hidden;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:30px;
    transition:transform .5s cubic-bezier(.4,0,.2,1), border-color .4s, box-shadow .5s;
    backdrop-filter:blur(20px);
}

.card::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:26px;
    background:conic-gradient(from 0deg, transparent, #ff4fa3, transparent 30%, #ff4fa3, transparent 60%);
    animation:rotateBorder 4s linear infinite;
    opacity:0;
    transition:opacity .4s;
    z-index:-1;
}

@keyframes rotateBorder{
    to{transform:rotate(360deg);}
}

.card .glow{
    position:absolute;
    inset:0;
    border-radius:24px;
    background:radial-gradient(circle 300px at var(--mx,50%) var(--my,50%),
        rgba(255,79,163,.52) 0%,
        rgba(255,79,163,.28) 30%,
        rgba(255,79,163,.08) 55%,
        transparent 80%);
    pointer-events:none;
    opacity:0;
    transition:opacity .35s ease;
    z-index:0;
    filter:blur(6px);
}

.card:hover .glow{opacity:1;}

.card > *:not(.glow){
    position:relative;
    z-index:1;
}

.card:hover{
    transform:translateY(-12px) scale(1.03);
    border-color:#ff4fa3;
    box-shadow:
        0 30px 60px rgba(255,79,163,.28),
        inset 0 0 40px rgba(255,79,163,.08);
}

.card:hover::before{opacity:1;}

.card:active{
    transform:translateY(-6px) scale(.98);
}

.card .icon{
    width:80px;
    height:80px;
    border-radius:20px;
    background:linear-gradient(145deg, rgba(255,79,163,.2), rgba(199,52,124,.1));
    border:1px solid rgba(255,79,163,.4);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all .5s cubic-bezier(.4,0,.2,1);
    box-shadow:0 0 24px rgba(255,79,163,.16);
}

.card:hover .icon{
    transform:scale(1.15) rotate(-8deg);
    background:linear-gradient(145deg, rgba(255,79,163,.4), rgba(199,52,124,.2));
    box-shadow:0 0 40px rgba(255,79,163,.48);
}

.card .icon svg{
    width:40px;
    height:40px;
    stroke:#fff;
    filter:drop-shadow(0 0 8px rgba(255,79,163,.64));
    transition:transform .5s ease;
}

.card:hover .icon svg{
    transform:scale(1.1);
    stroke:#ff8ac4;
}

.card .name{
    font-family:"Orbitron",sans-serif;
    font-size:18px;
    font-weight:700;
    letter-spacing:4px;
    text-transform:uppercase;
    color:#fff;
    text-shadow:0 0 12px rgba(255,79,163,.48);
    transition:all .4s;
}

.card:hover .name{
    color:#ff8ac4;
    text-shadow:0 0 20px rgba(255,79,163,.8);
    letter-spacing:6px;
}

.card .desc{
    font-size:11px;
    letter-spacing:3px;
    color:rgba(255,255,255,.5);
    text-transform:uppercase;
    font-weight:300;
    transition:color .4s;
}

.card:hover .desc{
    color:rgba(255,255,255,.8);
}

.card .line{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:3px;
    background:linear-gradient(90deg, transparent, #ff4fa3, transparent);
    transition:width .5s cubic-bezier(.4,0,.2,1);
    box-shadow:0 0 16px #ff4fa3;
    z-index:2;
}

.card:hover .line{width:80%;}

#aboutModal{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(.8);
    width:600px;
    max-width:calc(100vw - 40px);
    height:520px;
    max-height:calc(100vh - 40px);
    background:rgba(10,10,15,.98);
    border:1px solid rgba(255,79,163,.5);
    border-radius:24px;
    padding:30px;
    z-index:999999;
    box-shadow:
        0 30px 100px rgba(0,0,0,.8),
        0 0 64px rgba(255,79,163,.32);
    opacity:0;
    pointer-events:none;
    transition:all .5s cubic-bezier(.4,0,.2,1);
    display:flex;
    flex-direction:column;
}

#aboutModal.active{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
    pointer-events:auto;
}

#aboutModal::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:2px;
    background:linear-gradient(90deg, transparent, #ff4fa3, #fff, #ff4fa3, transparent);
    background-size:200% 100%;
    animation:shimmer 2s linear infinite;
    border-radius:24px 24px 0 0;
}

@keyframes shimmer{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
}

#modalTitle{
    font-family:"Orbitron",sans-serif;
    font-size:22px;
    font-weight:900;
    letter-spacing:6px;
    text-transform:uppercase;
    background:linear-gradient(135deg,#fff,#ff4fa3);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:20px;
    display:flex;
    align-items:center;
    gap:14px;
}

#modalTitle::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, #ff4fa3, transparent);
}

#aboutText{
    flex:1;
    overflow-y:auto;
    font-size:15px;
    line-height:1.8;
    color:#e8e8e8;
    white-space:pre-line;
    padding-right:10px;
}

#aboutText::-webkit-scrollbar{width:6px;}
#aboutText::-webkit-scrollbar-track{background:rgba(255,79,163,.05);border-radius:3px;}
#aboutText::-webkit-scrollbar-thumb{background:#ff4fa3;border-radius:3px;box-shadow:0 0 12px #ff4fa3;}

.modal-buttons{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid rgba(255,79,163,.2);
    gap:12px;
}

#langSelect{
    background:rgba(255,79,163,.1);
    border:1px solid rgba(255,79,163,.4);
    color:#fff;
    font-size:13px;
    padding:10px 16px;
    border-radius:12px;
    cursor:pointer;
    outline:none;
    font-family:"Inter",sans-serif;
    transition:all .3s;
}

#langSelect:hover{
    border-color:#ff4fa3;
    box-shadow:0 0 20px rgba(255,79,163,.32);
}

#langSelect option{background:#141414;color:#fff;}

button{
    background:linear-gradient(135deg, rgba(255,79,163,.2), rgba(199,52,124,.1));
    border:1px solid rgba(255,79,163,.5);
    color:#fff;
    padding:10px 24px;
    font-size:13px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    border-radius:12px;
    cursor:pointer;
    font-family:"Inter",sans-serif;
    transition:all .3s cubic-bezier(.4,0,.2,1);
    position:relative;
    overflow:hidden;
}

button::before{
    content:"";
    position:absolute;
    top:50%;
    left:50%;
    width:0;
    height:0;
    background:radial-gradient(circle, rgba(255,79,163,.48), transparent);
    transform:translate(-50%,-50%);
    transition:all .6s ease;
    border-radius:50%;
    pointer-events:none;
}

button:hover::before{width:300px;height:300px;}

button:hover{
    border-color:#ff4fa3;
    box-shadow:0 0 24px rgba(255,79,163,.48);
    transform:translateY(-2px);
}

button:active{transform:translateY(0) scale(.96);}

.price-btn{
    display:inline-block;
    margin-top:14px;
    padding:10px 20px;
    background:linear-gradient(135deg, rgba(255,79,163,.25), rgba(199,52,124,.15));
    border:1px solid #ff4fa3;
    border-radius:12px;
    cursor:pointer;
    font-size:13px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#fff;
    text-shadow:0 0 12px #ff4fa3;
    transition:all .3s;
    font-family:"Inter",sans-serif;
}

.price-btn:hover{
    background:linear-gradient(135deg, rgba(255,79,163,.5), rgba(199,52,124,.3));
    box-shadow:0 0 32px rgba(255,79,163,.64);
    transform:translateY(-3px) scale(1.05);
}

@media (max-width:1000px){
    .cards{grid-template-columns:repeat(2,1fr);}
    .title::before,.title::after{display:none;}
}

@media (max-width:560px){
    .cards{grid-template-columns:1fr;}
    .title h1{letter-spacing:-1px;}
    .title .sub{letter-spacing:10px;font-size:11px;}
    #aboutModal{height:80vh;padding:20px;}
}
</style>
</head>

<body>

<div class="bg"></div>
<canvas id="particles"></canvas>
<canvas id="cursorTrail"></canvas>

<section class="hero">

    <div class="title">
        <h1>Disvical</h1>
        <div class="sub">Snipe Services</div>
    </div>

    <div class="cards">

        <div class="card" data-link="https://www.youtube.com/@disvical">
            <div class="glow"></div>
            <div class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="#ff4fa3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
            </div>
            <div class="name">YouTube</div>
            <div class="desc">Subscribe</div>
            <div class="line"></div>
        </div>

        <div class="card" data-action="about">
            <div class="glow"></div>
            <div class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="#ff4fa3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="7" r="4"></circle>
                    <path d="M5.5 21a8.38 8.38 0 0 1 13 0"></path>
                </svg>
            </div>
            <div class="name">About</div>
            <div class="desc">Who am I</div>
            <div class="line"></div>
        </div>

        <div class="card" data-link="https://discord.gg/2ERVfhzzZr">
            <div class="glow"></div>
            <div class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="#ff4fa3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
            </div>
            <div class="name">Discord</div>
            <div class="desc">Join Server</div>
            <div class="line"></div>
        </div>

        <div class="card" data-link="https://www.roblox.com/pt/users/4370995126">
            <div class="glow"></div>
            <div class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="#ff4fa3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="14" rx="2"></rect>
                    <path d="M8 21l4-4 4 4"></path>
                </svg>
            </div>
            <div class="name">Roblox</div>
            <div class="desc">Profile</div>
            <div class="line"></div>
        </div>

    </div>

</section>

<div id="aboutModal">
    <div id="modalTitle">About me</div>
    <div id="aboutText"></div>
    <div class="modal-buttons">
        <select id="langSelect">
            <option value="en">English</option>
            <option value="pt">Português</option>
            <option value="kr">한국어</option>
        </select>
        <button onclick="closeAbout()">Close</button>
    </div>
</div>

<script>
const modal = document.getElementById("aboutModal");
const text = document.getElementById("aboutText");
const select = document.getElementById("langSelect");
const title = document.getElementById("modalTitle");

const aboutData = {
    en:`Hi, I'm Disvical, nice to meet you!\n\nI'm a high-level sniper and I finish my snipes in 2 days or less.\n\nDiscord @disvical`,
    pt:`Olá, eu sou o Disvical, prazer em te conhecer!\n\nSou um sniper de alto nível e finalizo meus snipes em 2 dias ou menos.\n\nDiscord @disvical`,
    kr:`안녕하세요, 저는 Disvical입니다.\n\n빠르게 작업합니다.\n\nDiscord @disvical`
};

const pricesText = `--- Robux Only ---\n\nFree Category:\nGlitch Snipe: 250+ HPs (500+ for priority)\n~ 750 if less than 250 HPs\n\nDreamspace Snipe: 250+ HPs (500+ for priority)\n~ 750 if less than 250 HPs\n\nSingularity Snipe: 20+ HPs (100+ to post on yt)\n~ all free! :)\n\nCyberspace Snipe:\nNot available yet\n\nMari Snipe:\n20 = Void Coin (After tax)\n10 = Lucky Penny (After tax)\n\nPriority Category:\n1000 = Instant Snipe\n\nExpect to have your snipe done in 1-2 days\nI usually finish a singularity snipe in less than 1 hour\nSingularity snipes will always have priority`;

function openAbout(){
    modal.classList.add("active");
    setLang(select.value);
}

function closeAbout(){modal.classList.remove("active");}

function setLang(lang){
    text.innerHTML = aboutData[lang].replace(/\n/g,'<br>') +
        `<br><br><span class="price-btn" onclick="togglePrices()">View Prices</span>`;
    title.innerText = "About me";
}

function togglePrices(){
    text.innerHTML = pricesText.replace(/\n/g,'<br>') +
        `<br><br><span class="price-btn" onclick="setLang(select.value)">Back</span>`;
    title.innerText = "Prices";
}

select.addEventListener('change', () => setLang(select.value));

document.querySelectorAll('.card').forEach(card => {
    const glow = card.querySelector('.glow');

    card.addEventListener('mousemove', e => {
        const r = card.getBoundingClientRect();
        const x = ((e.clientX - r.left) / r.width) * 100;
        const y = ((e.clientY - r.top) / r.height) * 100;
        glow.style.setProperty('--mx', x + '%');
        glow.style.setProperty('--my', y + '%');
    });

    card.addEventListener('click', () => {
        card.style.transform = 'scale(.94)';
        setTimeout(() => card.style.transform = '', 180);

        const action = card.dataset.action;
        const link = card.dataset.link;

        if (action === 'about') openAbout();
        else if (link) window.open(link, '_blank');
    });
});

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth; canvas.height = innerHeight;

let particles = [];
for (let i = 0; i < 100; i++) {
    particles.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random()*2.5+.5,
        dx: (Math.random()-.5)*.5,
        dy: (Math.random()-.5)*.5,
        hue: Math.random()>.5 ? '#ff4fa3' : '#fff',
        alpha: Math.random()*.5+.2
    });
}

function animateParticles(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for (let i=0;i<particles.length;i++){
        for (let j=i+1;j<particles.length;j++){
            const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
            const d=Math.sqrt(dx*dx+dy*dy);
            if (d<130){
                ctx.strokeStyle=`rgba(255,79,163,${(1-d/130)*.16})`;
                ctx.lineWidth=.5;
                ctx.beginPath();
                ctx.moveTo(particles[i].x,particles[i].y);
                ctx.lineTo(particles[j].x,particles[j].y);
                ctx.stroke();
            }
        }
    }
    for (let p of particles){
        p.x+=p.dx; p.y+=p.dy;
        if (p.x<0||p.x>canvas.width)p.dx*=-1;
        if (p.y<0||p.y>canvas.height)p.dy*=-1;
        ctx.fillStyle=p.hue;
        ctx.globalAlpha=p.alpha;
        ctx.shadowBlur=8;
        ctx.shadowColor=p.hue;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.shadowBlur=0;
    requestAnimationFrame(animateParticles);
}
animateParticles();

const tcanvas=document.getElementById("cursorTrail");
const tctx=tcanvas.getContext("2d");
tcanvas.width=innerWidth; tcanvas.height=innerHeight;

let points=[];
let mouse={x:innerWidth/2,y:innerHeight/2};
let bursts=[];
let mouseVisible = false;

document.addEventListener("mousemove", e => {
    mouse.x=e.clientX; mouse.y=e.clientY;
    if (!mouseVisible) mouseVisible = true;
});

document.addEventListener("mouseleave", () => {
    mouseVisible = false;
});

document.addEventListener("mousedown", () => {
    for (let i=0;i<15;i++){
        bursts.push({
            x:mouse.x, y:mouse.y,
            vx:(Math.random()-.5)*10,
            vy:(Math.random()-.5)*10,
            life:1
        });
    }
});

function drawCursor(){
    tctx.clearRect(0,0,tcanvas.width,tcanvas.height);

    if (!mouseVisible) {
        requestAnimationFrame(drawCursor);
        return;
    }

    points.push({x:mouse.x,y:mouse.y});
    if (points.length>25)points.shift();

    for (let i=0;i<points.length;i++){
        let p=points[i];
        let a=i/points.length;
        tctx.beginPath();
        tctx.fillStyle=`rgba(255,79,163,${a})`;
        tctx.shadowBlur=20;
        tctx.shadowColor="#ff4fa3";
        tctx.arc(p.x,p.y,6*a+1,0,Math.PI*2);
        tctx.fill();
    }

    for (let i=bursts.length-1;i>=0;i--){
        let b=bursts[i];
        b.x+=b.vx; b.y+=b.vy;
        b.vx*=.93; b.vy*=.93;
        b.life-=.025;
        if (b.life<=0){bursts.splice(i,1);continue;}
        tctx.beginPath();
        tctx.fillStyle=`rgba(255,255,255,${b.life})`;
        tctx.shadowBlur=16;
        tctx.shadowColor="#ff4fa3";
        tctx.arc(b.x,b.y,3*b.life,0,Math.PI*2);
        tctx.fill();
    }

    tctx.beginPath();
    tctx.fillStyle="#fff";
    tctx.shadowBlur=24;
    tctx.shadowColor="#ff4fa3";
    tctx.arc(mouse.x,mouse.y,5,0,Math.PI*2);
    tctx.fill();

    tctx.beginPath();
    tctx.strokeStyle="rgba(255,79,163,.7)";
    tctx.lineWidth=1.5;
    tctx.shadowBlur=16;
    tctx.shadowColor="#ff4fa3";
    tctx.arc(mouse.x,mouse.y,14,0,Math.PI*2);
    tctx.stroke();

    requestAnimationFrame(drawCursor);
}
drawCursor();

addEventListener('resize', () => {
    canvas.width=innerWidth; canvas.height=innerHeight;
    tcanvas.width=innerWidth; tcanvas.height=innerHeight;
});
</script>
