<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disvical — Snipe Services</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

html,body{height:100%;}

body{
    font-family:"Inter",sans-serif;
    background:#000;
    color:#fff;
    overflow-x:hidden;
    cursor:none;
    min-height:100vh;
    position:relative;
}

.bg{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
}
.bg::before{
    content:"";
    position:absolute;
    inset:-50%;
    background:
        radial-gradient(circle at 30% 40%, rgba(255,255,255,.08), transparent 40%),
        radial-gradient(circle at 70% 60%, rgba(255,255,255,.05), transparent 40%);
    animation:bgMove 15s ease-in-out infinite;
    filter:blur(60px);
}
@keyframes bgMove{
    0%,100%{transform:translate(0,0) scale(1);}
    33%{transform:translate(10%,-5%) scale(1.15);}
    66%{transform:translate(-8%,8%) scale(1.1);}
}
.bg::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:50px 50px;
    animation:gridMove 4s linear infinite;
    mask-image:radial-gradient(ellipse at center, black 20%, transparent 80%);
    -webkit-mask-image:radial-gradient(ellipse at center, black 20%, transparent 80%);
}
@keyframes gridMove{
    from{background-position:0 0;}
    to{background-position:50px 50px;}
}

#cursorTrail{
    position:fixed;
    inset:0;
    pointer-events:none;
}
#cursorTrail{z-index:2147483647;}

.hero{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:60px 30px 80px;
    gap:55px;
}

.title{
    text-align:center;
    position:relative;
    animation:titleIn 1.2s cubic-bezier(.4,0,.2,1) both;
}
@keyframes titleIn{
    from{opacity:0;transform:translateY(-50px) scale(.9);}
    to{opacity:1;transform:translateY(0) scale(1);}
}
.title h1{
    font-family:"Orbitron",sans-serif;
    font-size:clamp(48px,10vw,140px);
    font-weight:900;
    letter-spacing:-2px;
    line-height:.9;
    background:linear-gradient(180deg,#fff 0%,#999 50%,#333 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 32px rgba(255,255,255,.4)) drop-shadow(0 0 64px rgba(255,255,255,.2));
    text-transform:uppercase;
    animation:titleGlow 3s ease-in-out infinite;
}
@keyframes titleGlow{
    0%,100%{filter:drop-shadow(0 0 32px rgba(255,255,255,.4)) drop-shadow(0 0 64px rgba(255,255,255,.2));}
    50%{filter:drop-shadow(0 0 48px rgba(255,255,255,.55)) drop-shadow(0 0 96px rgba(255,255,255,.3));}
}
.title .sub{
    font-size:14px;
    letter-spacing:20px;
    text-transform:uppercase;
    font-weight:300;
    margin-top:20px;
    padding-left:20px;
    background:linear-gradient(90deg, #000 0%, #fff 50%, #000 100%);
    background-size:200% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:gradientShift 6s ease-in-out infinite;
}
@keyframes gradientShift{
    0%,100%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
}
.title::before,
.title::after{
    content:"";
    position:absolute;
    top:50%;
    width:80px;
    height:1px;
    background:linear-gradient(90deg,transparent,#fff);
}
.title::before{left:-100px;}
.title::after{right:-100px;background:linear-gradient(90deg,#fff,transparent);}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:24px;
    max-width:1200px;
    width:100%;
    animation:cardsIn 1s ease .4s both;
}
@keyframes cardsIn{
    from{opacity:0;transform:translateY(40px);}
    to{opacity:1;transform:translateY(0);}
}

.card{
    position:relative;
    aspect-ratio:1/1.15;
    border-radius:24px;
    background:linear-gradient(145deg, rgba(30,30,30,.7), rgba(10,10,10,.9));
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:30px;
    transition:transform .5s cubic-bezier(.4,0,.2,1), box-shadow .5s;
    backdrop-filter:blur(20px);
    overflow:hidden;
    isolation:isolate;
}

.card::before{
    content:"";
    position:absolute;
    top:50%;
    left:50%;
    width:200%;
    height:200%;
    transform:translate(-50%,-50%);
    background:conic-gradient(from 0deg,
        #000 0deg,
        #333 30deg,
        #666 60deg,
        #999 90deg,
        #ccc 120deg,
        #fff 150deg,
        #fff 180deg,
        #ccc 210deg,
        #999 240deg,
        #666 270deg,
        #333 300deg,
        #000 330deg,
        #000 360deg);
    animation:rotateBorder 4s linear infinite;
    opacity:0;
    transition:opacity .5s ease;
    pointer-events:none;
    z-index:1;
}
@keyframes rotateBorder{
    from{transform:translate(-50%,-50%) rotate(0deg);}
    to{transform:translate(-50%,-50%) rotate(360deg);}
}
.card:hover::before{opacity:1;}

.card::after{
    content:"";
    position:absolute;
    inset:3px;
    border-radius:21px;
    background:linear-gradient(145deg, #1a1a1a, #0a0a0a);
    z-index:2;
    pointer-events:none;
}

.card .glow{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    border-radius:24px;
    background:radial-gradient(circle at var(--mx,50%) var(--my,50%),
        rgba(255,255,255,.25) 0%,
        rgba(255,255,255,.1) 25%,
        transparent 60%);
    pointer-events:none;
    opacity:0;
    transition:opacity .35s ease;
    z-index:3;
    filter:blur(6px);
}
.card:hover .glow{opacity:1;}

.card > *:not(.glow){
    position:relative;
    z-index:4;
}

.card:hover{
    transform:translateY(-12px) scale(1.03);
    box-shadow:0 30px 60px rgba(255,255,255,.15);
}
.card:active{
    transform:translateY(-6px) scale(.98);
}

.card .icon{
    width:80px;
    height:80px;
    border-radius:50%;
    background:linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.3);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all .5s cubic-bezier(.4,0,.2,1);
    box-shadow:0 0 24px rgba(255,255,255,.1);
}
.card:hover .icon{
    transform:scale(1.15) rotate(-8deg);
    background:linear-gradient(145deg, rgba(255,255,255,.25), rgba(255,255,255,.1));
    box-shadow:0 0 40px rgba(255,255,255,.35);
}
.card .icon svg{
    width:40px;
    height:40px;
    stroke:#fff;
    filter:drop-shadow(0 0 8px rgba(255,255,255,.5));
    transition:transform .5s ease;
}
.card:hover .icon svg{transform:scale(1.1);}

.card .name{
    font-family:"Orbitron",sans-serif;
    font-size:18px;
    font-weight:700;
    letter-spacing:4px;
    text-transform:uppercase;
    color:#fff;
    text-shadow:0 0 12px rgba(255,255,255,.3);
    transition:all .4s;
}
.card:hover .name{
    text-shadow:0 0 20px rgba(255,255,255,.6);
    letter-spacing:6px;
}
.card .desc{
    font-size:11px;
    letter-spacing:3px;
    color:rgba(255,255,255,.4);
    text-transform:uppercase;
    font-weight:300;
    transition:color .4s;
}
.card:hover .desc{color:rgba(255,255,255,.7);}

.divider{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    max-width:1000px;
    margin:20px auto 0;
    padding:10px 0;
}
.divider .line-seg{
    flex:1;
    height:3px;
    background:linear-gradient(90deg,transparent 0%,#fff 50%,transparent 100%);
    border-radius:3px;
    box-shadow:
        0 0 10px rgba(255,255,255,.7),
        0 0 20px rgba(255,255,255,.4);
}
.divider .star{
    width:44px;
    height:44px;
    margin:0 24px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    animation:starPulse 3s ease-in-out infinite;
}
@keyframes starPulse{
    0%,100%{
        transform:scale(1) rotate(0deg);
        filter:drop-shadow(0 0 12px rgba(255,255,255,.8))
               drop-shadow(0 0 24px rgba(255,255,255,.5));
    }
    50%{
        transform:scale(1.15) rotate(180deg);
        filter:drop-shadow(0 0 20px rgba(255,255,255,1))
               drop-shadow(0 0 40px rgba(255,255,255,.7));
    }
}
.divider .star svg{width:100%;height:100%;display:block;}

#aboutModal{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(.8);
    width:600px;
    max-width:calc(100vw - 40px);
    height:520px;
    max-height:calc(100vh - 40px);
    background:rgba(10,10,15,.98);
    border-radius:24px;
    padding:30px;
    z-index:999999;
    box-shadow:
        0 30px 100px rgba(0,0,0,.8),
        0 0 64px rgba(255,255,255,.1);
    opacity:0;
    pointer-events:none;
    transition:all .5s cubic-bezier(.4,0,.2,1);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    isolation:isolate;
}

#aboutModal::before{
    content:"";
    position:absolute;
    top:50%;
    left:50%;
    width:200%;
    height:200%;
    transform:translate(-50%,-50%);
    background:conic-gradient(from 0deg,
        #000 0deg,
        #333 30deg,
        #666 60deg,
        #999 90deg,
        #ccc 120deg,
        #fff 150deg,
        #fff 180deg,
        #ccc 210deg,
        #999 240deg,
        #666 270deg,
        #333 300deg,
        #000 330deg,
        #000 360deg);
    animation:rotateBorderModal 4s linear infinite;
    opacity:0;
    transition:opacity .5s ease;
    pointer-events:none;
    z-index:1;
}
@keyframes rotateBorderModal{
    from{transform:translate(-50%,-50%) rotate(0deg);}
    to{transform:translate(-50%,-50%) rotate(360deg);}
}

#aboutModal::after{
    content:"";
    position:absolute;
    inset:3px;
    border-radius:21px;
    background:linear-gradient(145deg, #1a1a1a, #0a0a0a);
    z-index:2;
    pointer-events:none;
}

#aboutModal.active{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
    pointer-events:auto;
}
#aboutModal.active::before{opacity:1;}

#aboutModal > *{
    position:relative;
    z-index:3;
}

#modalTitle{
    font-family:"Orbitron",sans-serif;
    font-size:22px;
    font-weight:900;
    letter-spacing:6px;
    text-transform:uppercase;
    background:linear-gradient(135deg,#fff,#888);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:20px;
    display:flex;
    align-items:center;
    gap:14px;
}
#modalTitle::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, #fff, transparent);
}
#aboutText{
    flex:1;
    overflow-y:auto;
    font-size:15px;
    line-height:1.8;
    color:#e8e8e8;
    white-space:pre-line;
    padding-right:10px;
    display:flex;
    flex-direction:column;
}
#aboutText::-webkit-scrollbar{width:6px;}
#aboutText::-webkit-scrollbar-track{background:rgba(255,255,255,.05);border-radius:3px;}
#aboutText::-webkit-scrollbar-thumb{background:#fff;border-radius:3px;box-shadow:0 0 12px #fff;}

#aboutText .text-content{flex:1;}

#aboutText .price-btn-wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-top:24px;
    padding-top:20px;
}

.price-btn{
    display:inline-block;
    padding:12px 32px;
    background:linear-gradient(135deg, rgba(255,255,255,.15), rgba(255,255,255,.05));
    border:1px solid #fff;
    border-radius:12px;
    cursor:pointer;
    font-size:13px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#fff;
    transition:all .3s;
    font-family:"Inter",sans-serif;
}
.price-btn:hover{
    background:linear-gradient(135deg, rgba(255,255,255,.25), rgba(255,255,255,.1));
    transform:translateY(-2px);
}

.modal-buttons{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid rgba(255,255,255,.15);
    gap:12px;
}

#langSelect{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.3);
    color:#fff;
    font-size:13px;
    padding:10px 16px;
    border-radius:12px;
    cursor:pointer;
    outline:none;
    font-family:"Inter",sans-serif;
    transition:all .3s;
}
#langSelect:hover{
    border-color:#fff;
}
#langSelect option{background:#141414;color:#fff;}

button{
    background:linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.35);
    color:#fff;
    padding:10px 24px;
    font-size:13px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    border-radius:12px;
    cursor:pointer;
    font-family:"Inter",sans-serif;
    transition:all .3s cubic-bezier(.4,0,.2,1);
}
button:hover{
    border-color:#fff;
    transform:translateY(-2px);
}
button:active{transform:translateY(0) scale(.96);}

@media (max-width:1000px){
    .cards{grid-template-columns:repeat(2,1fr);}
    .title::before,.title::after{display:none;}
}
@media (max-width:560px){
    .cards{grid-template-columns:1fr;}
    .title h1{letter-spacing:-1px;}
    .title .sub{letter-spacing:10px;font-size:11px;}
    #aboutModal{height:80vh;padding:20px;}
    .divider .star{width:30px;height:30px;margin:0 14px;}
    .divider .line-seg{height:2px;}
}
</style>
</head>

function openAbout(){
    modal.classList.add("active");
    setLang(select.value);
}
function closeAbout(){modal.classList.remove("active");}

function setLang(lang){
    const t = translations[lang];
    text.innerHTML = `
        <div class="text-content">${t.aboutText.replace(/\n/g,'<br>')}</div>
        <div class="price-btn-wrapper">
            <span class="price-btn" onclick="togglePrices()">${t.viewPrices}</span>
        </div>
    `;
    title.innerText = t.aboutTitle;
}

function togglePrices(){
    const lang = select.value;
    const t = translations[lang];
    text.innerHTML = `
        <div class="text-content">${t.pricesText.replace(/\n/g,'<br>')}</div>
        <div class="price-btn-wrapper">
            <span class="price-btn" onclick="setLang('${lang}')">${t.back}</span>
        </div>
    `;
    title.innerText = t.pricesTitle;
}

select.addEventListener('change', () => setLang(select.value));

document.querySelectorAll('.card').forEach(card => {
    const glow = card.querySelector('.glow');

    card.addEventListener('mousemove', e => {
        const r = card.getBoundingClientRect();
        glow.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
        glow.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
    });

    card.addEventListener('click', () => {
        card.style.transform = 'scale(.94)';
        setTimeout(() => card.style.transform = '', 180);

        const action = card.dataset.action;
        const link = card.dataset.link;
        if (action === 'about') openAbout();
        else if (link) window.open(link, '_blank');
    });
});

const tcanvas=document.getElementById("cursorTrail");
const tctx=tcanvas.getContext("2d");
tcanvas.width=innerWidth; tcanvas.height=innerHeight;

let points=[];
let mouse={x:innerWidth/2,y:innerHeight/2};
let bursts=[];
let mouseVisible = false;

document.addEventListener("mousemove", e => {
    mouse.x=e.clientX; mouse.y=e.clientY;
    if (!mouseVisible) mouseVisible = true;
});
document.addEventListener("mouseleave", () => {mouseVisible = false;});
document.addEventListener("mousedown", () => {
    for (let i=0;i<15;i++){
        bursts.push({
            x:mouse.x, y:mouse.y,
            vx:(Math.random()-.5)*10,
            vy:(Math.random()-.5)*10,
            life:1
        });
    }
});

function drawCursor(){
    tctx.clearRect(0,0,tcanvas.width,tcanvas.height);
    if (!mouseVisible){requestAnimationFrame(drawCursor);return;}

    points.push({x:mouse.x,y:mouse.y});
    if (points.length>25)points.shift();

    for (let i=0;i<points.length;i++){
        let p=points[i];
        let a=i/points.length;
        tctx.beginPath();
        tctx.fillStyle=`rgba(255,255,255,${a})`;
        tctx.shadowBlur=20;
        tctx.shadowColor="#fff";
        tctx.arc(p.x,p.y,6*a+1,0,Math.PI*2);
        tctx.fill();
    }
    for (let i=bursts.length-1;i>=0;i--){
        let b=bursts[i];
        b.x+=b.vx; b.y+=b.vy;
        b.vx*=.93; b.vy*=.93;
        b.life-=.025;
        if (b.life<=0){bursts.splice(i,1);continue;}
        tctx.beginPath();
        tctx.fillStyle=`rgba(255,255,255,${b.life})`;
        tctx.shadowBlur=16;
        tctx.shadowColor="#fff";
        tctx.arc(b.x,b.y,3*b.life,0,Math.PI*2);
        tctx.fill();
    }
    tctx.beginPath();
    tctx.fillStyle="#fff";
    tctx.shadowBlur=24;
    tctx.shadowColor="#fff";
    tctx.arc(mouse.x,mouse.y,5,0,Math.PI*2);
    tctx.fill();

    tctx.beginPath();
    tctx.strokeStyle="rgba(255,255,255,.7)";
    tctx.lineWidth=1.5;
    tctx.shadowBlur=16;
    tctx.shadowColor="#fff";
    tctx.arc(mouse.x,mouse.y,14,0,Math.PI*2);
    tctx.stroke();

    requestAnimationFrame(drawCursor);
}
drawCursor();

addEventListener('resize', () => {
    canvas.width=innerWidth; canvas.height=innerHeight;
    tcanvas.width=innerWidth; tcanvas.height=innerHeight;
});
</script>
